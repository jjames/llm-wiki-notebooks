name: Notebook integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notebook-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate notebook structure and outputs
        run: python scripts/check_notebooks.py
      - name: Execute fast notebooks from clean kernels
        run: python scripts/check_notebooks.py --execute fast
